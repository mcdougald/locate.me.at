<text x="255" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="255" dy="0">Sourced chapters,</tspan><tspan x="255" dy="19">rendered on the</tspan><tspan x="255" dy="19">server.</tspan></text>
