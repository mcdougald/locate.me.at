<text x="680" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="680" dy="0">Local search across</tspan><tspan x="680" dy="21">every section, and a</tspan><tspan x="680" dy="21">quick reference for</tspan><tspan x="680" dy="21">geolocation error</tspan><tspan x="680" dy="21">codes.</tspan></text>
