<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="468" dy="0">Uncertainty</tspan><tspan x="468" dy="22">made visible</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">An interactive figure</tspan><tspan x="468" dy="21">with fictional radii</tspan><tspan x="468" dy="21">shows what an</tspan><tspan x="468" dy="21">accuracy circle</tspan><tspan x="468" dy="21">really means.</tspan></text>
