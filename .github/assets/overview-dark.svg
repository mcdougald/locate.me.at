<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="44" dy="0">Seven sourced</tspan><tspan x="44" dy="22">chapters</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">The API, permissions,</tspan><tspan x="44" dy="21">accuracy, motion,</tspan><tspan x="44" dy="21">coarse signals,</tspan><tspan x="44" dy="21">devices and the</tspan><tspan x="44" dy="21">privacy cost.</tspan></text>
<rect x="236" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#404040" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="256" dy="0">Never asks</tspan><tspan x="256" dy="22">where you are</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Reading the site</tspan><tspan x="256" dy="21">never calls the</tspan><tspan x="256" dy="21">location or motion</tspan><tspan x="256" dy="21">APIs, so there is no</tspan><tspan x="256" dy="21">prompt to grant.</tspan></text>
